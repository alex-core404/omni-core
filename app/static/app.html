<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Omni">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => {
                    if (!reg.scope.includes("/static/push/")) reg.unregister();
                });
            });
        }
        async function markChatOpen() {
            if (!("caches" in window)) return;
            const cache = await caches.open("omni-presence");
            if (document.visibilityState !== "visible") {
                await cache.delete("/presence");
                return;
            }
            await cache.put("/presence", new Response(JSON.stringify({ at: Date.now() }), {
                headers: {"Content-Type": "application/json"}
            }));
            if (!("serviceWorker" in navigator)) return;
            const reg = await navigator.serviceWorker.getRegistration();
            if (!reg) return;
            const notes = await reg.getNotifications();
            notes.forEach((note) => note.close());
        }
        markChatOpen();
        setInterval(markChatOpen, 2000);
        document.addEventListener("visibilitychange", markChatOpen);
    </script>
    <title>Omni</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #080c0a; }
        html, body { overflow: hidden; }
        body {
            position: fixed;
            left: 0;
            right: 0;
            top: var(--app-top, 0px);
            bottom: var(--app-bottom, 0px);
            height: var(--app-height, auto);
            background: #080c0a;
            color: #e4efe9;
            font-family: sans-serif;
            display: flex;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        body.keyboard-open {
            padding-top: 0;
            padding-bottom: 0;
        }
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #080c0a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        #login-screen[hidden] { display: none; }
        .login-card { width: min(360px, 100%); }
        .login-card h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 500;
        }
        .login-card input {
            width: 100%;
            display: block;
            padding: 12px;
            margin-bottom: 12px;
            background: #1a2420;
            border: 1px solid #1c2a24;
            border-radius: 8px;
            color: #e4efe9;
            font-size: 16px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #3ddc97;
            border: none;
            border-radius: 8px;
            color: #04140d;
            font-size: 15px;
        }
        .login-card button.secondary { background: #1a2420; color: #e4efe9; }
        .login-error { color: #ff6b6b; text-align: center; min-height: 1.2em; }
        .sidebar {
            width: 280px;
            background: #080c0a;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #15201b;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #15201b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }
        #my-username {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: #e4efe9;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #5d7569;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
        }
        .nav-btn.danger { color: #ff6b6b; }
        .contacts { flex: 1; overflow-y: auto; }
        .contacts-label {
            padding: 14px 16px 6px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
            color: #5d7569;
            letter-spacing: 0.08em;
            text-transform: uppercase;

        .contact {
            padding: 8px 8px 8px 16px;
            border-bottom: 1px solid #15201b;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .contact.active {
            background: #0e1512;
            border-left: 2px solid #3ddc97;
            padding-left: 14px;
        }
        .contact-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .contact-ai .contact-name { color: #3ddc97; }
        .ai-mark {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3ddc97;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .presence {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3f3c;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .unread-badge {
            display: none;
            background: #3ddc97;
            color: #04140d;
            border-radius: 10px;
            padding: 2px 7px;
            margin-right: 4px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
        }
        .contact-del {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            background: none;
            border: none;
            color: #5d7569;
            font-size: 16px;
            cursor: pointer;
        }
        .add-contact {
            padding: 12px;
            border-top: 1px solid #15201b;
            display: flex;
            gap: 8px;
        }
        .add-contact input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            background: #080c0a;
            border: 1px solid #1c2a24;
            border-radius: 4px;
            color: #e4efe9;
            font-size: 16px;
            font-family: sans-serif;
        }
        .add-contact input::placeholder { color: #5d7569; }
        .add-contact button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            background: #3ddc97;
            border: none;
            border-radius: 4px;
            color: #04140d;
            cursor: pointer;
            font-size: 18px;
        }
        .chat {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            flex-shrink: 0;
            min-height: 62px;
            padding: 12px 14px;
            background: #080c0a;
            border-bottom: 1px solid rgba(61, 220, 151, .14);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        #menu-btn {
            display: none;
            width: 32px;
            background: none;
            border: none;
            color: #e4efe9;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        #header-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3f3c;
            flex-shrink: 0;
            display: none;
        }
        #chat-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 500;
        }
        #typing-indicator {
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
            color: #5d7569;
            display: none;
        }
        .ai-orb {
            display: none;
            width: 38px;
            height: 38px;
            position: relative;
            flex-shrink: 0;
        }
        .chat.ai-open .ai-orb { display: block; }
        .ai-orb .core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 14px;
            height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            background: #3ddc97;
            box-shadow: 0 0 16px 3px rgba(61, 220, 151, .7);
        }
        .ai-orb .ring {
            position: absolute;
            inset: 0;
            border: 1px solid #3ddc97;
            border-radius: 50%;
            animation: orb-pulse 2.4s ease-out infinite;
        }
        .ai-orb .ring.late { animation-delay: 1.2s; }
        @keyframes orb-pulse {
            from { transform: scale(.45); opacity: .9; }
            to { transform: scale(1.5); opacity: 0; }
        }
        .messages {
            flex: 1;
            min-height: 0;
            padding: 16px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty-chat {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5d7569;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
        }
        .chat:has(#empty-chat) .input-area { display: none; }
        .date-sep {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6b8578;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
        }
        .date-sep::before,
        .date-sep::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(61, 220, 151, .14);
        }
        .message {
            position: relative;
            width: fit-content;
            max-width: 86%;
            display: flex;
            flex-direction: column;
            font-size: 14px;
            line-height: 1.35;
        }
        .message.out {
            max-width: 78%;
            align-self: flex-end;
            background: #3ddc97;
            color: #04140d;
            border-radius: 12px 12px 2px 12px;
            padding: 8px 10px;
        }
        .message.in {
            align-self: flex-start;
            background: #0e1512;
            color: #e4efe9;
            border: 1px solid #1f3a2e;
            border-radius: 4px;
            padding: 10px 12px;
        }
        .ai-caption {
            margin-bottom: 6px;
            color: #3ddc97;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
        }
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
        .corner.tl {
            top: -1px;
            left: -1px;
            border-top: 2px solid #3ddc97;
            border-left: 2px solid #3ddc97;
        }
        .corner.br {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid #3ddc97;
            border-bottom: 2px solid #3ddc97;
        }
        .msg-line {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .msg-body { min-width: 0; }
        .msg-meta {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
            line-height: 1;
            white-space: nowrap;
        }
        .message.out .msg-meta { color: rgba(4, 20, 13, .65); }
        .message.in .msg-meta { color: #5d7569; }
        .message.ai,
        .message.ai-typing {
            background: rgba(61, 220, 151, .07);
            border-color: rgba(61, 220, 151, .28);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        .message.ai .msg-meta { color: #7f9a8d; }
        .message.out .tick.read { color: #04140d; }
        .message.ai-typing {
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }
        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #3ddc97;
            animation: typing-wave 1.2s ease-in-out infinite;
        }
        .typing-dot.d2 { animation-delay: .2s; }
        .typing-dot.d3 { animation-delay: .4s; }
        @keyframes typing-wave {
            0%, 100% { transform: translateY(0); opacity: .35; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
        .input-area {
            flex-shrink: 0;
            padding: 12px;
            background: rgba(61, 220, 151, .07);
            border-top: 1px solid rgba(61, 220, 151, .28);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .composer-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }
        .input-area textarea {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid rgba(61, 220, 151, .28);
            border-radius: 4px;
            color: #e4efe9;
            font-size: 16px;
            font-family: sans-serif;
            resize: none;
            overflow-y: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .input-area textarea::placeholder { color: #7f9a8d; }
        input, textarea, button {
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }
        .add-contact input:focus,
        .input-area textarea:focus {
            outline: none;
            border-color: #3ddc97;
            box-shadow: none;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        #attach-btn {
            background: transparent;
            border: 1px solid rgba(61, 220, 151, .28);
        }
        #send-btn {
            background: #3ddc97;
            border: none;
        }
        .icon-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox.open {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .sidebar {
                position: absolute;
                left: -100%;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 100;
                transition: left 200ms ease-out;
            }
            .sidebar.open {
                left: 0;
            }
            .chat {
                width: 100%;
            }
            #menu-btn { display: block !important; }
        }

            @keyframes float-heart {
                0% { opacity: 1; transform: translateY(0) scale(1); }
                100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
            }
            .heart {
                position: absolute;
                font-size: 16px;
                animation: float-heart 1.5s ease forwards;
                pointer-events: none;
                z-index: 999;
            }
            .chat.special {
                position: relative;
                overflow: hidden;
                background: #1a0a0f;
            }

            .chat.special::before {
                content: "";
            }
            .chat.special .bg-heart {
                pointer-events: none;
                z-index: 0;
            }

            .chat.special .messages,
            .chat.special .input-area,
            .chat.special .chat-header {
                position: relative;
                z-index: 1;
                background: transparent !important;
            }
            .reaction-picker {
                position: absolute;
                background: #0e1512;
                border: 1px solid #1f3a2e;
                border-radius: 4px;
                padding: 6px 10px;
                display: flex;
                gap: 6px;
                z-index: 100;
            }
            .reaction-picker span {
                font-size: 20px;
                cursor: pointer;
            }
            .reaction-picker span:hover {
                transform: scale(1.3);
            }
            .reactions-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-top: 4px;
            }
            .reaction-btn {
                background: transparent;
                border: 1px solid rgba(61, 220, 151, .35);
                border-radius: 999px;
                padding: 0 6px;
                font-size: 13px;
                line-height: 20px;
                color: #7f9a8d;
                cursor: pointer;
            }
            .message.out .reaction-btn {
                border-color: rgba(4, 20, 13, .28);
                color: #04140d;
            }
            .reaction-btn:hover { background: rgba(61, 220, 151, .12); }
            .reply-preview {
                background: #0e1512;
                border-left: 2px solid #3ddc97;
                padding: 6px 10px;
                border-radius: 4px;
                font-size: 12px;
                color: #5d7569;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .reply-preview span {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 90%;
            }
            .reply-preview button {
                background: none;
                border:none;
                color: #888;
                cursor: pointer;
                font-size: 16px;
                padding: 0;
                flex-shrink: 0;
            }
            .reply-quote {
                border-left: 2px solid #3ddc97;
                padding: 4px 8px;
                margin-bottom: 6px;
                font-size: 12px;
                color: #5d7569;
                background: transparent;
            }
            .message pre {
                background: #15201b;
                border-radius: 4px;
                padding: 12px;
                overflow-x: auto;
                margin: 8px 0;
                color: #e4efe9;
            }
            .message code {
                font-family: ui-monospace, "SF Mono", Menlo, monospace;
                font-size: 13px;
                background: #15201b;
                padding: 2px 4px;
                border-radius: 4px;
                color: #e4efe9;
            }
            .message pre code {
                background: none;
                padding: 0;
            }
            .message h1, .message h2, .message h3 {
                margin-top: 12px;
                margin-bottom: 8px;
            }
            .message p { margin: 0; }
            .message p + p { margin-top: 6px; }
            .chat.special .message.out {
                background: #d94f7c;
                color: #fff;
                border: none;
            }
            .chat.special .message.in {
                background: #4a0020;
                color: #f3d5df;
                border-color: transparent;
            }
            .chat.special .message.out .msg-meta { color: rgba(255, 255, 255, .7); }
            .chat.special .message.out .tick.read { color: #fff; }
            @supports not (backdrop-filter: blur(1px)) {
                .message.ai,
                .message.ai-typing,
                .input-area {
                    background: #0e1512;
                }
            }
            #messages.hold { opacity: 0; }
            #messages.swap-out {
                opacity: 0;
                transition: opacity 280ms ease-out;
            }
            #messages.swap-in { animation: thread-in 420ms ease-out; }
            @keyframes thread-in {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .message.arrive { animation: msg-in 320ms ease-out; }
            @keyframes msg-in {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: none; }
            }
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }

    </style>

<body>
<div id="login-screen" hidden>
    <div class="login-card">
        <h1>Omni</h1>
        <input id="login-email" type="email" placeholder="Email" autocomplete="username">
        <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" onkeydown="if(event.key==='Enter') loginFromApp()">
        <button type="button" onclick="loginFromApp()">Войти</button>
        <button type="button" class="secondary" onclick="registerFromApp()">Зарегистрироваться</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
</div>
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="my-username"></span>
            <button class="nav-btn" onclick="window.location.href='/static/profile.html'">Профиль</button>
            <button class="nav-btn danger" onclick="logout()">Выйти</button>
        </div>
        <div class="contacts" id="contacts"></div>
        <div class="add-contact">
            <input id="new-contact" placeholder="Логин контакта" />
            <button onclick="addContact()">+</button>
        </div>
    </div>

    <div class="chat">
        <div class="chat-header" id="chat-header">
            <button id="menu-btn" onclick="toggleSidebar()" aria-label="Меню">☰</button>
            <div class="ai-orb" aria-hidden="true"><span class="ring"></span><span class="ring late"></span><span class="core"></span></div>
            <span id="header-dot"></span>
            <span id="chat-title">Выберите контакт</span>
            <span id="typing-indicator">печатает...</span>
        </div>
        <div class="messages" id="messages">
            <div class="empty-chat" id="empty-chat">Выберите контакт</div>
        </div>
        <div class="input-area">
            <div id="reply-preview" class="reply-preview" style="display:none;">
                <span id="reply-preview-text"></span>
                <button onclick="cancelReply()">x</button>
            </div>
            <div class="composer-row">
                <textarea id="message-input" placeholder="Сообщение..." disabled
                    onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
                    oninput="onTyping(); autoResize()"></textarea>
            <input type="file" id="file-input" accepts="image/*" multiple style="display:none" onchange="uploadFiles(this.files)"/>
            <button id="attach-btn" class="icon-btn" disabled onclick="document.getElementById('file-input').click()" aria-label="Вложение"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 7.5v3.2a2 2 0 0 0 4 0V5.2a3 3 0 0 0-6 0v6a4 4 0 0 0 8 0V7" fill="none" stroke="#7f9a8d" stroke-width="1.4" stroke-linecap="round"/></svg></button>
            <button id="send-btn" class="icon-btn" disabled onclick="sendMessage()" aria-label="Отправить"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v9M4.5 6.5 8 3l3.5 3.5" fill="none" stroke="#04140d" stroke-width="1.6" stroke-linecap="square"/></svg>            </button>
        </div>
        </div>
    </div>

    <script>
        marked.setOptions({
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });
        const API = window.location.origin;
        const email = localStorage.getItem("email");
        const token = localStorage.getItem("token");

        if (!token) {
            document.getElementById("login-screen").hidden = false;
        }

        function pinChatToScreen() {
            const vv = window.visualViewport;
            if (!vv || vv.height < 50) {
                document.documentElement.style.removeProperty("--app-height");
                document.documentElement.style.removeProperty("--app-top");
                document.body.classList.remove("keyboard-open");
                return;
            }
            const keyboardOpen = window.screen.availHeight - vv.height > 120;
            document.documentElement.style.setProperty("--app-height", Math.round(vv.height) + "px");
            document.documentElement.style.setProperty("--app-top", Math.round(vv.offsetTop) + "px");
            document.body.classList.toggle("keyboard-open", keyboardOpen);
            window.scrollTo(0, 0);
            const messages = document.getElementById("messages");
            if (!messages) return;
            const distanceFromBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
            if (distanceFromBottom < 120) messages.scrollTop = messages.scrollHeight;
        }
        if (window.visualViewport) {
            visualViewport.addEventListener("resize", pinChatToScreen);
            visualViewport.addEventListener("scroll", pinChatToScreen);
        }
        window.addEventListener("resize", pinChatToScreen);
        window.addEventListener("pageshow", pinChatToScreen);
        pinChatToScreen();

        if (token) {
            document.getElementById("my-username").innerText = "@" + (localStorage.getItem("username") || email);
            if (!localStorage.getItem("username")) {
                fetch(`${API}/auth/me`, {
                    headers: {"Authorization": `Bearer ${token}`}
                }).then(r => r.json()).then(data => {
                    if (data.username) {
                        localStorage.setItem("username", data.username);
                        document.getElementById("my-username").innerText = "@" + data.username;
                    }
                });
            }
        }


        let ws;
        let currentContact = null;
        let contacts = [];
        let seenMessageIds = new Set();
        let lastMessageId = 0;
        let historyReady = false;

        function toggleSidebar() {
            const sidebar = document.querySelector(".sidebar");
            sidebar.classList.toggle("open");
        }

        async function loadContacts() {
            const res = await fetch(`${API}/contacts/${email}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            contacts = await res.json();
            renderContacts();
        }
        async function updateUnreadCount() {
            try {
                const res = await fetch(`${API}/unread/${email}`, {
                    headers: {"Authorization": `Bearer ${token}`}
                });
                const counts = await res.json();
                const totalUnread = Object.values(counts).reduce((a, b) => a + b, 0);
                if (totalUnread > 0) {
                    document.title = `(${totalUnread}) Omni`;
                } else {
                    document.title = `Omni`;
                }
            } catch (err) {
                console.error("Ошибка обновления счётчика непрочитанных:", err);
            }
        }

        function renderContacts() {
            const div = document.getElementById("contacts");
            div.innerHTML = "";

            const aiEl = document.createElement("div");
            aiEl.className = "contact contact-ai" + (currentContact === "ai-bot@omni" ? " active" : "");
            aiEl.onclick = () => {
                openChat("ai-bot@omni");
                document.querySelector(".sidebar").classList.remove("open");
            };
            const aiIcon = document.createElement("span");
            aiIcon.className = "ai-mark";
            const aiName = document.createElement("span");
            aiName.className = "contact-name";
            aiName.textContent = "Omni AI";
            aiEl.appendChild(aiIcon);
            aiEl.appendChild(aiName);
            div.appendChild(aiEl);

            const contactsHeader = document.createElement("div");
            contactsHeader.className = "contacts-label";
            contactsHeader.textContent = "Контакты";
            div.appendChild(contactsHeader);

            contacts.filter(c => c.email !== "ai-bot@omni").forEach(c => {
                const el = document.createElement("div");
                el.className = "contact" + (c.email === currentContact ? " active" : "");

                const dot = document.createElement("span");
                dot.className = "presence";
                dot.id = `dot-${c.email.replace('@','_').replace('.','_')}`;

                const name = document.createElement("span");
                name.className = "contact-name";
                name.textContent = c.username;
                name.onclick = () => {
                    openChat(c.email);
                    document.querySelector(".sidebar").classList.remove("open");
                };

                const badge = document.createElement("span");
                badge.className = "unread-badge";
                badge.id = `badge-${c.email.replace('@','_').replace(/\./g,'_')}`;

                const del = document.createElement("button");
                del.className = "contact-del";
                del.type = "button";
                del.setAttribute("aria-label", "Удалить контакт");
                del.textContent = "✕";
                del.onclick = (e) => { e.stopPropagation(); deleteContact(c.email); };

                el.appendChild(dot);
                el.appendChild(name);
                el.appendChild(badge);
                el.appendChild(del);
                div.appendChild(el);
            });
        }

        async function updateUnread() {
            const res = await fetch(`${API}/unread/${email}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            const counts = await res.json();
            contacts.forEach(c => {
                const id = `badge-${c.email.replace(`@`,`_`).replace(/\./g,`_`)}`;
                const badge = document.getElementById(id);
                if (!badge) return;
                const count = counts[c.email] || 0;
                if (count > 0) {
                    badge.innerText = count;
                    badge.style.display = "inline";
                } else {
                    badge.style.display = "none";
                }
            });
        }


        async function updateOnlineStatus() {
            for (const c of contacts) {
                const res = await fetch(`${API}/online/${c.email}`);
                const data = await res.json();
                const id = `dot-${c.email.replace('@','_').replace('.','_')}`;
                const dot = document.getElementById(id);
                if (dot) dot.style.background = data.online ? "#ffffff" : "#3a3f3c";
                if (currentContact) {
                    const res = await fetch(`${API}/online/${currentContact}`);
                    const data = await res.json();
                    document.getElementById("header-dot").style.background = data.online ? "#ffffff" : "#3a3f3c";
                }
            }
        }

        async function deleteContact(contact) {
            if (!confirm(`Удалить контакт ${contact}?`)) return;
            await fetch(`${API}/contacts/delete?owner_email=${email}&contact_email=${contact}`, {
                method: "DELETE",
                headers: {"Authorization": `Bearer ${token}`}
            });
            await loadContacts();
        }

        async function addContact() {
            const val = document.getElementById("new-contact").value.trim();
            if (!val) return;
            const userRes = await fetch(`${API}/auth/user/${val}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            if (!userRes.ok) {
                alert("Пользователь не найден");
                return;
            }
            const userData = await userRes.json();
            if (contacts.find(c => c.email === userData.email)) {
                alert("Контакт уже добавлен");
                return;
            }
            await fetch(`${API}/contacts/add?owner_email=${email}&contact_email=${userData.email}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            await loadContacts();
            document.getElementById("new-contact").value = "";
        }

        function enableComposer() {
            document.getElementById("message-input").disabled = false;
            document.getElementById("attach-btn").disabled = false;
            document.getElementById("send-btn").disabled = false;
            const empty = document.getElementById("empty-chat");
            if (empty) empty.remove();
        }

        let chatSwap = 0;

        function motionOff() {
            return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        }

        function pinThreadEnd(box) {
            const pin = () => { box.scrollTop = box.scrollHeight; };
            pin();
            requestAnimationFrame(() => {
                pin();
                requestAnimationFrame(pin);
            });
        }

        function openChat(contact) {
            const swap = ++chatSwap;
            currentContact = contact;
            enableComposer();
            const c = contacts.find(c => c.email === contact);
            document.getElementById("chat-title").textContent = contact === "ai-bot@omni" ? "Omni AI" : (c ? c.username : contact);
            const headerDot = document.getElementById("header-dot");
            if (contact === "ai-bot@omni") {
                headerDot.style.display = "none";
            } else {
                headerDot.style.display = "inline-block";
                headerDot.style.background = "#3a3f3c";
            }

            const box = document.getElementById("messages");
            const showThread = () => {
                if (swap !== chatSwap) return;
                box.classList.remove("swap-out");
                if (!motionOff()) box.classList.add("hold");
                box.innerHTML = "";
                seenMessageIds = new Set();
                lastMessageId = 0;
                lastMessageDay = "";
                historyReady = false;
                hideAiTypingIndicator();
                loadHistory(contact).finally(() => {
                    if (swap !== chatSwap) return;
                    box.classList.remove("hold");
                    pinThreadEnd(box);
                    if (motionOff()) return;
                    box.classList.remove("swap-in");
                    void box.offsetWidth;
                    box.classList.add("swap-in");
                    box.addEventListener("animationend", (e) => {
                        if (e.target !== box) return;
                        box.classList.remove("swap-in");
                    });
                });
            };
            if (!motionOff() && box.childElementCount) {
                setTimeout(() => {
                    if (swap !== chatSwap) return;
                    box.classList.add("swap-out");
                    setTimeout(showThread, 280);
                }, 220);
            } else {
                showThread();
            }

            const chat = document.querySelector(".chat");
            chat.classList.toggle("ai-open", contact === "ai-bot@omni");

            if ((contact === "kazambievauzli@mail.ru" && email === "asotnikov705@gmail.com") ||
                (contact === "asotnikov705@gmail.com" && email === "kazambievauzli@mail.ru")) {
                chat.classList.add("special");
                spawnBackgroundHearts();
            } else {
                chat.classList.remove("special");
                chat.style.background = "";
                const hearts = document.querySelectorAll(".bg-heart");
                console.log("Удаляем сердечек:", hearts.length);
                hearts.forEach(h => h.remove());
            }

            renderContacts();
            document.querySelector(".sidebar").classList.remove("open");

            fetch(`${API}/read/${email}/${contact}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            if (ws) {
                ws.send(JSON.stringify({type: "read", to: contact}));
            }

        }

        async function loadHistory(contact) {
            let url = `${API}/history/${email}/${contact}`;
            if (contact === "ai-bot@omni") {
                url = `${API}/ai-history/${email}`;
            }
            const res = await fetch(url, { headers: {"Authorization": `Bearer ${token}`} });
            const data = await res.json();
            if (currentContact !== contact) return;
            data.forEach(msg => {
                const type = msg.is_ai ? "in" : (msg.from == email ? "out" : "in");
                addMessage(msg.message, type, msg.created_at, msg.id, msg.is_read, msg.reply_to_id, msg.reply_to_text, msg.is_ai);
            });
            historyReady = true;
        }

        async function syncOpenChat() {
            if (!currentContact || !historyReady) return;
            const contact = currentContact;
            let url = `${API}/history/${email}/${contact}`;
            if (contact === "ai-bot@omni") {
                url = `${API}/ai-history/${email}`;
            }
            if (lastMessageId) {
                url += `?after_id=${lastMessageId}`;
            }
            try {
                const res = await fetch(url, { headers: {"Authorization": `Bearer ${token}`} });
                if (!res.ok || currentContact !== contact) return;
                const data = await res.json();
                data.forEach(msg => {
                    const type = msg.is_ai ? "in" : (msg.from == email ? "out" : "in");
                    addMessage(msg.message, type, msg.created_at, msg.id, msg.is_read, msg.reply_to_id, msg.reply_to_text, msg.is_ai);
                });
            } catch (err) {
                console.error("Ошибка подтягивания чата:", err);
            }
        }

        function spawnBackgroundHearts() {
            const isSpecial = (currentContact === "kazambievauzli@mail.ru" && email === "asotnikov705@gmail.com") ||
                  (currentContact === "asotnikov705@gmail.com" && email === "kazambievauzli@mail.ru");
            if (!isSpecial) return;

            const container = document.querySelector(".chat.special");
            container.querySelectorAll(".bg-heart").forEach(h => h.remove());

            for (let i = 0; i < 40; i++) {
                const heart = document.createElement("span");
                heart.className = "bg-heart";
                heart.innerText = "❤️";
                heart.style.position = "absolute";
                heart.style.left = Math.random() * container.clientWidth + "px";
                heart.style.top = Math.random() * container.clientHeight + "px";
                heart.style.fontSize = 14 + Math.random() * 24 + "px";
                heart.style.opacity = 0.05 + Math.random() * 0.1;
                container.appendChild(heart);
            }
        }


        function connectWS() {
            const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${wsProto}//${location.host}/ws/${email}`);
            ws.onopen = function(e) {
                console.log("Connected to WebSocket");

            };
            ws.onmessage = async function(event) {
                const data = JSON.parse(event.data);
                updateUnreadCount();
                if (!contacts.find(c => c.email === data.from) && data.from !== "ai-bot@omni") {
                    await fetch(`${API}/contacts/add?owner_email=${email}&contact_email=${data.from}`, {
                        method: "POST",
                        headers: {"Authorization": `Bearer ${token}`}
                    });
                    await loadContacts();
                }
                if (data.type === "typing" && data.from === currentContact) {
                    const indicator = document.getElementById("typing-indicator");
                    indicator.style.display = "inline";
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => indicator.style.display = "none", 3000);
                } else if (data.type === "read" && data.from === currentContact) {
                    document.querySelectorAll(".tick").forEach(tick => {
                        tick.textContent = "✓✓";
                        tick.classList.add("read");
                    });
                } else if (data.from === "ai-bot@omni" && (data.chat_with === currentContact || currentContact === "ai-bot@omni")) {
                    hideAiTypingIndicator();
                    addMessage(data.message, "in", null, data.id, false, null, null, true, true);
                } else if (data.from === email && data.to === currentContact) {
                    addMessage(data.message, "out", null, data.id, false, null, null);
                } else if (data.from === currentContact) {
                    addMessage(data.message, "in", null, data.id, false, data.reply_to_id, data.reply_to_text, false, true);
                    fetch(`${API}/read/${email}/${currentContact}`, {
                        method: "POST",
                        headers: {"Authorization": `Bearer ${token}`}
                    });
                    if (ws) {
                        ws.send(JSON.stringify({type: "read", to: currentContact}));
                    }
                }

            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        function openLightbox(src) {
            document.getElementById("lightbox-img").src = src;
            document.getElementById("lightbox").classList.add("open");
        }
        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("open");
        }


        let lastMessageDay = "";

        function dayKey(time) {
            const d = new Date(time);
            return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
        }

        function dayLabel(time) {
            const d = new Date(time);
            const start = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
            const diff = Math.round((start(new Date()) - start(d)) / 86400000);
            if (diff === 0) return "сегодня";
            if (diff === 1) return "вчера";
            return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
        }

        function insertInThread(container, node) {
            if (aiTypingElement && container.contains(aiTypingElement)) {
                container.insertBefore(node, aiTypingElement);
            } else {
                container.appendChild(node);
            }
        }

        function addMessage(text, type, time = null, msgId = null, isRead = false, replyId = null, replyText = null, isAi = false, arrive = false) {
            if (msgId && seenMessageIds.has(String(msgId))) return;
            if (msgId) {
                seenMessageIds.add(String(msgId));
                if (Number(msgId) > lastMessageId) lastMessageId = Number(msgId);
            }
            if (isAi && aiTypingSince) {
                const fresh = time && new Date(time).getTime() >= aiTypingSince - 5000;
                if (historyReady || fresh) hideAiTypingIndicator();
            }
            const div = document.getElementById("messages");
            const msg = document.createElement("div");
            msg.className = "message " + type;
            if (isAi) msg.classList.add("ai");
            if (arrive) msg.classList.add("arrive");

            const isSpecialChat = (currentContact === "kazambievauzli@mail.ru" && email === "asotnikov705@gmail.com") ||
                      (currentContact === "asotnikov705@gmail.com" && email === "kazambievauzli@mail.ru");

            if (isAi) {
                const caption = document.createElement("div");
                caption.className = "ai-caption";
                caption.textContent = "omni ai";
                msg.appendChild(caption);
                ["tl", "br"].forEach((side) => {
                    const corner = document.createElement("span");
                    corner.className = "corner " + side;
                    msg.appendChild(corner);
                });
            }

            if (replyText) {
                const quote = document.createElement("div");
                quote.className = "reply-quote";
                quote.innerText = replyText;
                msg.appendChild(quote);
            }

            const line = document.createElement("div");
            line.className = "msg-line";

            if (text.startsWith("/uploads/")) {
                const img = document.createElement("img");
                img.src = `${API}${text}`;
                img.style.cssText = "max-width:100%;border-radius:4px;display:block;";
                img.style.cursor = "zoom-in";
                img.onclick = () => openLightbox(img.src);
                line.appendChild(img);
            } else {
                const htmlContent = marked.parse(text);
                const contentDiv = document.createElement("div");
                contentDiv.className = "msg-body";
                contentDiv.innerHTML = htmlContent;
                line.appendChild(contentDiv);
                contentDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            const meta = document.createElement("div");
            meta.className = "msg-meta";

            if (time) {
                const timeEl = document.createElement("span");
                timeEl.className = "msg-time";
                timeEl.textContent = new Date(time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                meta.appendChild(timeEl);
            }

            if (type === 'out') {
                const tick = document.createElement("span");
                tick.className = "tick" + (isRead ? " read" : "");
                tick.textContent = isRead ? "✓✓" : "✓";
                if (msgId) tick.dataset.id = msgId;
                meta.appendChild(tick);
            }

            line.appendChild(meta);
            msg.appendChild(line);

            const reactionsBar = document.createElement("div");
            reactionsBar.className = "reactions-bar";
            if (msgId) {
                reactionsBar.id = `reactions-${msgId}`;
                loadReactions(msgId);
            }
            msg.appendChild(reactionsBar);

            if (time) {
                const key = dayKey(time);
                if (key !== lastMessageDay) {
                    lastMessageDay = key;
                    const sep = document.createElement("div");
                    sep.className = "date-sep";
                    sep.textContent = dayLabel(time);
                    insertInThread(div, sep);
                }
            }
            insertInThread(div, msg);
            div.scrollTop = div.scrollHeight;


            if (msgId) {
                let pressTimer;
                msg.addEventListener("mousedown", () => {
                    pressTimer = setTimeout(() => showReactionPicker(msgId, msg), 500);
                });
                msg.addEventListener("mouseup", () => clearTimeout(pressTimer));
                msg.addEventListener("mouseleave", () => clearTimeout(pressTimer));

                msg.addEventListener("touchstart", () => {
                    pressTimer = setTimeout(() => showReactionPicker(msgId, msg), 500);
                });
                msg.addEventListener("touchend", () => clearTimeout(pressTimer));

                const replyBth = document.createElement("button");
                replyBth.innerText = "↩";
                replyBth.style.cssText = "background:none;border:none;color:inherit;cursor:pointer;font-size:14px;padding:0 0 0 4px;opacity:0;";
                replyBth.onclick = (e) => {
                    e.stopPropagation();
                    setReply(msgId,text);
                };
                msg.addEventListener("mouseenter", () => replyBth.style.opacity = "1");
                msg.addEventListener("mouseleave", () => replyBth.style.opacity = "0");
                meta.appendChild(replyBth);
            }

            if (isSpecialChat && type === "out") {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const heart = document.createElement("span");
                        heart.className = "heart";
                        heart.innerText = "❤️";
                        heart.style.left = (msg.offsetLeft + Math.random() * msg.offsetWidth) + "px";
                        heart.style.top = (msg.offsetTop + Math.random() * msg.offsetHeight) + "px";
                        heart.style.color = "#8b0038";
                        heart.style.fontSize = (14 + Math.random() * 16) + "px";
                        div.appendChild(heart);
                        setTimeout(() => heart.remove(), 1500 + Math.random() * 1000);
                    }, i * 100);
                }
            }
        }
        let aiTypingElement = null;
        let aiTypingTimer = null;
        let aiTypingSince = 0;

        function scheduleAiTypingIndicator() {
            clearTimeout(aiTypingTimer);
            aiTypingSince = Date.now();
            aiTypingTimer = setTimeout(showAiTypingIndicator, 3000);
        }

        function showAiTypingIndicator() {
            if (aiTypingElement) return;

            const messagesDiv = document.getElementById("messages");
            const typingMsg = document.createElement("div");
            typingMsg.className = "message in ai ai-typing";
            typingMsg.innerHTML = '<span class="corner tl"></span><span class="corner br"></span><span class="typing-dot"></span><span class="typing-dot d2"></span><span class="typing-dot d3"></span>';
            messagesDiv.appendChild(typingMsg);
            aiTypingElement = typingMsg;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideAiTypingIndicator() {
            clearTimeout(aiTypingTimer);
            aiTypingTimer = null;
            aiTypingSince = 0;
            if (aiTypingElement) {
                aiTypingElement.remove();
                aiTypingElement = null;
            }
        }

        let typingTimeout = null;

        let replyToId = null;
        let replyToText = null;

        function setReply(msgId, text) {
            replyToId = msgId;
            replyToText = text;
            document.getElementById("reply-preview").style.display = "flex";
            document.getElementById("reply-preview-text").innerText = text;
            document.getElementById("message-input").focus();
        }

        function cancelReply() {
            replyToId = null;
            replyToText = null;
            document.getElementById("reply-preview").style.display = "none";
            document.getElementById("reply-preview-text").innerText = "";
        }
        function autoResize() {
            const textarea = document.getElementById("message-input");
            textarea.style.height = "auto";
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + "px";
        }

        let reactionPickerEl = null;

        function showReactionPicker(msgId, anchorEl) {
            closeReactionPicker();
            const picker = document.createElement("div");
            picker.className = "reaction-picker";
            ["👍", "❤️", "😂", "😮", "😢", "🔥"].forEach(emoji => {
                const span = document.createElement("span");
                span.innerText = emoji;
                span.onclick = () => {
                    toggleReaction(msgId, emoji);
                    closeReactionPicker();
                };
                picker.appendChild(span);
            });
            anchorEl.style.position = "relative";
            anchorEl.appendChild(picker);
            reactionPickerEl = picker;
            setTimeout(() => document.addEventListener("click", closeReactionPicker, {once: true}), 100);
        }

        function closeReactionPicker() {
            if (reactionPickerEl) {
                reactionPickerEl.remove();
                reactionPickerEl = null;
            }
        }

        async function toggleReaction(msgId, emoji) {
            await fetch(`${API}/reactions/${msgId}/${encodeURIComponent(emoji)}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            await loadReactions(msgId);
        }

        async function loadReactions(msgId) {
            const res = await fetch(`${API}/reactions/${msgId}`);
            const counts = await res.json();
            const bar = document.getElementById(`reactions-${msgId}`);
            if (!bar) return;
            bar.innerHTML = "";
            Object.entries(counts).forEach(([emoji, count]) => {
                const btn = document.createElement("button");
                btn.className = "reaction-btn";
                btn.innerText = `${emoji} ${count}`;
                btn.onclick = () => toggleReaction(msgId, emoji);
                bar.appendChild(btn);
            });
        }

        function onTyping() {
            if (!currentContact || !ws) return;
            ws.send(JSON.stringify({type: "typing", to: currentContact}));
        }

        async function uploadFiles(files) {
            if (!currentContact) return;
            for (const file of files) {
                const formData = new FormData();
                formData.append("file", file);
                const res = await fetch(`${API}/upload`, {
                    method: "POST",
                    headers: {"Authorization": `Bearer ${token}`},
                    body: formData
                });
                const data = await res.json();
                if (data.url) {
                    ws.send(JSON.stringify({to: currentContact, message: data.url}));
                    syncOpenChat();
                }
            }
            document.getElementById("file-input").value = "";
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text || !currentContact || !ws) return;
            ws.send(JSON.stringify({
                to: currentContact,
                message: text,
                reply_to_id: replyToId
            }));
            if (text.startsWith("@ai") || currentContact === "ai-bot@omni") {
                scheduleAiTypingIndicator();
            }
            input.value = "";
            syncOpenChat();
            autoResize();
            cancelReply();
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("email");
            localStorage.removeItem("username");
            window.location.replace("/static/app.html");
        }

        async function loginFromApp() {
            const emailInput = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const error = document.getElementById("login-error");
            error.style.color = "#ff6b6b";
            error.textContent = "";
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: emailInput, password })
                });
                const data = await res.json();
                if (!data.access_token) {
                    error.textContent = "Неверный email или пароль";
                    return;
                }
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("email", emailInput);
                if (data.username) localStorage.setItem("username", data.username);
                window.location.replace("/static/app.html");
            } catch (e) {
                error.textContent = "Сервер не ответил";
            }
        }

        async function registerFromApp() {
            const emailInput = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const error = document.getElementById("login-error");
            error.style.color = "#ff6b6b";
            error.textContent = "";
            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: emailInput, password })
                });
                const data = await res.json();
                if (data.id) {
                    error.style.color = "#3ddc97";
                    error.textContent = "Зарегистрирован. Войдите.";
                    return;
                }
                error.textContent = "Ошибка регистрации";
            } catch (e) {
                error.textContent = "Сервер не ответил";
            }
        }

        if (token) {
            loadContacts();
            updateOnlineStatus();
            updateUnread();
            setInterval(updateOnlineStatus, 5000);
            setInterval(updateUnread, 5000);
            connectWS();
            updateUnreadCount();
            setInterval(updateUnreadCount, 3000);
            setInterval(syncOpenChat, 3000);
        }
    </script>
</body>
</html>
