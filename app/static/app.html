<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            height: 100dvh;
        }
        .sidebar {
            width: 280px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2a2a;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .contacts { flex: 1; overflow-y: auto; }
        .contact {
            padding: 16px 20px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }
        .contact:hover { background: #2a2a2a; }
        .contact.active { background: #2a2a2a; }
        .add-contact {
            padding: 16px 20px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 8px;
        }
        .add-contact input {
            flex: 1;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
        }
        .add-contact button {
            padding: 8px 12px;
            background: #6c63ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
        }
        .message.out {
            background: #6c63ff;
            align-self: flex-end;
        }
        .message.in {
            background: #2a2a2a;
            align-self: flex-start;
        }
        .input-area {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }
        .input-area button {
            padding: 12px 20px;
            background: #6c63ff;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        .logout { 
            background: none; 
            border: none; 
            color: #888; 
            cursor: pointer;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100%;
                z-index: 100;
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .chat {
                width: 100%;
            }
            #menu-btn {
                display: inline-block !important;
            }
            .chat-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 50;
            }
            .messages {
                padding-top: 80px;
            }
        } 
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="my-username" style="font-size:13px;color:#ccc;"></span>
            <button class="logout" onclick="window.location.href='/static/profile.html'" style="margin-right:8px;">Профиль</button>
            <button class="logout" onclick="logout()">Выйти</button>
        </div>
        <div style="padding:12px 20px;font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;">Контакты</div>
        <div class="contacts" id="contacts"></div>
        <div class="add-contact">
            <input id="new-contact" placeholder="Логин контакта" />
            <button onclick="addContact()">+</button>
        </div>
    </div>

    <div class="chat">
        <div class="chat-header" id="chat-header">
            <button id="menu-btn" onclick="toggleSidebar()" style="display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;margin-right:12px;">☰</button>
            <span id="header-dot" style="width:8px;height:8px;border-radius:50%;background:#444;margin-right:8px;display:none;flex-shrink:0;"></span>
            <span id="chat-title">Выберите контакт</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">→</button>
        </div>
    </div>

    <script>
        const API = "http://5.42.110.162:8000";
        const email = localStorage.getItem("email");
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "/static/index.html";

        document.getElementById("my-username").innerText = "@" + (localStorage.getItem("username") || email);
        if (!localStorage.getItem("username")) {
            fetch(`${API}/auth/me`, {
                headers: {"Authorization": `Bearer ${token}`}
            }).then(r => r.json()).then(data => {
                if (data.username) {
                    localStorage.setItem("username", data.username);
                    document.getElementById("my-username").innerText = "@" + data.username;
                }
            });
        }
        

        let ws;
        let currentContact = null;
        let contacts = [];

        function toggleSidebar() {
            const sidebar = document.querySelector(".sidebar");
            sidebar.classList.toggle("open");
        }

        async function loadContacts() {
            const res = await fetch(`${API}/contacts/${email}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            contacts = await res.json();
            renderContacts();
        }

        function renderContacts() {
            const div = document.getElementById("contacts");
            div.innerHTML = "";
            contacts.forEach(c => {
                const el = document.createElement("div");
                el.className = "contact" + (c.email === currentContact ? " active" : "");
            
                const dot = document.createElement("span");
                dot.style.cssText = "width:8px;height:8px;border-radius:50%;background:#444;margin-right:8px;flex-shrink:0;";
                dot.id = `dot-${c.email.replace('@','_').replace('.','_')}`;

                const name = document.createElement("span");
                name.innerText = c.username;
                name.onclick = () => {
                    openChat(c.email);
                    document.querySelector(".sidebar").classList.remove("open");
                };
                name.style.flex = "1";

                const badge = document.createElement("span");
                badge.id = `badge-${c.email.replace('@','_').replace(/\./g,'_')}`;
                badge.style.cssText = "background:#ff4444;color:#fff;border-radius:10px;padding:2px 7px;font-size:11px;display:none;margin-right:6px;";

                el.appendChild(dot);
            
                const del = document.createElement("button");
                del.innerText = "✕";
                del.style.cssText = "background:none;border:none;color:#888;cursor:pointer;font-size:12px;";
                del.onclick = (e) => { e.stopPropagation(); deleteContact(c.email); };
                
                el.style.display = "flex";
                el.style.alignItems = "center";
                el.appendChild(name);
                el.appendChild(badge);
                el.appendChild(del);
                div.appendChild(el);
            });
        }

        async function updateUnread() {
            const res = await fetch(`${API}/unread/${email}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            const counts = await res.json();
            contacts.forEach(c => {
                const id = `badge-${c.email.replace(`@`,`_`).replace(/\./g,`_`)}`;
                const badge = document.getElementById(id);
                if (!badge) return;
                const count = counts[c.email] || 0;
                if (count > 0) {
                    badge.innerText = count;
                    badge.style.display = "inline";
                } else {
                    badge.style.display = "none";
                }
            });
        }    
        

        async function updateOnlineStatus() {
            for (const c of contacts) {
                const res = await fetch(`${API}/online/${c.email}`);
                const data = await res.json();
                const id = `dot-${c.email.replace('@','_').replace('.','_')}`;
                const dot = document.getElementById(id);
                if (dot) dot.style.background = data.online ? "#44ff44" : "#444";
                if (currentContact) {
                    const res = await fetch(`${API}/online/${currentContact}`);
                    const data = await res.json();
                    document.getElementById("header-dot").style.background = data.online ? "#44ff44" : "#444";
                }
            }
        }

        async function deleteContact(contact) {
            if (!confirm(`Удалить контакт ${contact}?`)) return;
            await fetch(`${API}/contacts/delete?owner_email=${email}&contact_email=${contact}`, {
                method: "DELETE",
                headers: {"Authorization": `Bearer ${token}`}
            });
            await loadContacts();
        }

        async function addContact() {
            const val = document.getElementById("new-contact").value.trim();
            if (!val) return;
            const userRes = await fetch(`${API}/auth/user/${val}`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            if (!userRes.ok) {
                alert("Пользователь не найден");
                return;
            }
            const userData = await userRes.json();
            if (contacts.find(c => c.email === userData.email)) {
                alert("Контакт уже добавлен");
                return;
            }
            await fetch(`${API}/contacts/add?owner_email=${email}&contact_email=${userData.email}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            await loadContacts();
            document.getElementById("new-contact").value = "";
        }

        function openChat(contact) {
            currentContact = contact;
            const c = contacts.find(c => c.email === contact);
            document.getElementById("chat-title").innerText = c ? c.username : contact;
            const headerDot = document.getElementById("header-dot");
            headerDot.style.display = "inline-block";
            headerDot.style.background = "#444";
            document.getElementById("messages").innerHTML = "";
            renderContacts();
            document.querySelector(".sidebar").classList.remove("open");
            loadHistory(contact);
            fetch(`${API}/read/${email}/${contact}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
        }
        async function loadHistory(contact) {
            const res = await fetch(`${API}/history/${email}/${contact}`,{
                headers: {"Authorization": `Bearer ${token}`}
            });
            const data = await res.json();
            data.forEach(msg => {
                addMessage(msg.message, msg.from === email ? "out" : "in");
            });
        }


        function connectWS() {
            ws = new WebSocket(`ws://5.42.110.162:8000/ws/${email}`);
            ws.onmessage = async function(event) {
                const data = JSON.parse(event.data);
                if (!contacts.find(c => c.email === data.from)) {
                    await fetch(`${API}/contacts/add?owner_email=${email}&contact_email=${data.from}`, {
                        method: "POST",
                        headers: {"Authorization": `Bearer ${token}`}
                    });
                    await loadContacts();
                }
                if (data.from === currentContact) {
                    addMessage(data.message, "in");
                }
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        function addMessage(text, type) {
            const div = document.getElementById("messages");
            const msg = document.createElement("div");
            msg.className = "message " + type;
            msg.innerText = text;
            div.appendChild(msg);
            div.scrollTop = div.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text || !currentContact || !ws) return;
            ws.send(JSON.stringify({to: currentContact, message: text}));
            addMessage(text, "out");
            input.value = "";
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("email");
            window.location.href = "/static/index.html";
        }

        
        loadContacts();
        updateOnlineStatus();
        updateUnread();
        setInterval(updateOnlineStatus, 5000);
        setInterval(updateUnread, 5000);
        connectWS();
    </script>
</body>
</html>
