<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Omni">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => {
                    if (!reg.scope.includes("/static/push/")) reg.unregister();
                });
            });
        }
    </script>
    <title>Omni — Профиль</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #080c0a; }
        body {
            background: #080c0a;
            color: #e4efe9;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: transparent;
            border-radius: 0;
            padding: 40px 24px;
            width: min(360px, 100%);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 { font-size: 20px; font-weight: 500; }
        .email { color: #5d7569; font-size: 14px; }
        input {
            padding: 12px;
            background: #1a2420;
            border: 1px solid #1c2a24;
            border-radius: 8px;
            color: #e4efe9;
            font-size: 16px;
            width: 100%;
        }
        input:focus {
            outline: none;
            border-color: #3ddc97;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-save { background: #3ddc97; color: #04140d; }
        .btn-back, .btn-note {
            background: transparent;
            border: 1px solid rgba(61, 220, 151, .28);
            color: #e4efe9;
        }
        .msg { font-size: 13px; color: #3ddc97; display: none; }
        .err { font-size: 13px; color: #ff6b6b; display: none; }
        @media (max-width: 600px) {
            body {
                align-items: stretch;
                justify-content: flex-start;
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
            .card {
                width: 100%;
                height: auto;
                min-height: 100%;
                border-radius: 0;
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Профиль</h2>
        <div class="email" id="my-email"></div>
        <input id="username" placeholder="Введите логин (4-20 символов)" />
        <button class="btn-save" onclick="saveUsername()">Сохранить</button>
        <button id="push-btn" class="btn-note" onclick="enablePush()">Уведомления</button>
        <div class="msg" id="msg">Логин сохранён!</div>
        <div class="err" id="err"></div>
        <button class="btn-back" onclick="goBack()">← Вернуться в чат</button>
    </div>

    <script>
        const API = window.location.origin;
        const email = localStorage.getItem("email");
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "/static/index.html";

        document.getElementById("my-email").innerText = email;

        async function saveUsername() {
            const username = document.getElementById("username").value.trim();
            const msg = document.getElementById("msg");
            const err = document.getElementById("err");
            msg.style.display = "none";
            err.style.display = "none";

            const res = await fetch(`${API}/auth/set-username?username=${username}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            if (res.ok) {
                msg.style.display = "block";
                localStorage.setItem("username", username);
            } else {
                const data = await res.json();
                err.innerText = data.detail;
                err.style.display = "block";
            }
        }

        function goBack() {
            window.location.href = "/static/app.html";
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = "=".repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
            const raw = atob(base64);
            return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
        }

        async function enablePush() {
            if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
                alert("Этот телефон не умеет уведомления");
                return;
            }
            let reg;
            try {
                reg = await navigator.serviceWorker.register("/static/push/sw.js");
            } catch (e) {
                alert("Скрипт уведомлений не установился.");
                return;
            }
            let sub = await reg.pushManager.getSubscription();
            if (!sub) {
                const permission = await Notification.requestPermission();
                if (permission !== "granted") {
                    alert("Разрешение не дано");
                    return;
                }
                const keyRes = await fetch(`${API}/push/vapid-public`, {
                    headers: {"Authorization": `Bearer ${token}`}
                });
                const keyData = await keyRes.json();
                if (!keyRes.ok) {
                    alert(keyData.detail || "Сервер не отдал ключ");
                    return;
                }
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(keyData.public_key)
                });
            }
            const res = await fetch(`${API}/push/subscribe`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(sub)
            });
            if (res.ok) {
                document.getElementById("push-btn").style.display = "none";
                alert("Адрес телефона сохранён. Баннер придёт, когда чат закрыт.");
            } else {
                alert("Сервер не сохранил адрес");
            }
        }

        async function hidePushButtonIfEnabled() {
            if (!("serviceWorker" in navigator) || Notification.permission !== "granted") return;
            try {
                const reg = await navigator.serviceWorker.getRegistration("/static/push/sw.js");
                if (!reg) return;
                const sub = await reg.pushManager.getSubscription();
                if (sub) document.getElementById("push-btn").style.display = "none";
            } catch (e) {}
        }

        hidePushButtonIfEnabled();
    </script>
</body>
</html>
