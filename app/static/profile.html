<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Omni — Профиль</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 { font-size: 20px; }
        .email { color: #888; font-size: 14px; }
        input {
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            width: 100%;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-save { background: #6c63ff; color: #fff; }
        .btn-back { background: #2a2a2a; color: #aaa; }
        .msg { font-size: 13px; color: #44ff44; display: none; }
        .err { font-size: 13px; color: #ff4444; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Профиль</h2>
        <div class="email" id="my-email"></div>
        <input id="username" placeholder="Введите логин (4-20 символов)" />
        <button class="btn-save" onclick="saveUsername()">Сохранить</button>
        <div class="msg" id="msg">Логин сохранён!</div>
        <div class="err" id="err"></div>
        <button class="btn-back" onclick="goBack()">← Вернуться в чат</button>
    </div>

    <script>
        const API = "http://5.42.110.162:8000";
        const email = localStorage.getItem("email");
        const token = localStorage.getItem("token");

        if (!token) window.location.href = "/static/index.html";

        document.getElementById("my-email").innerText = email;

        async function saveUsername() {
            const username = document.getElementById("username").value.trim();
            const msg = document.getElementById("msg");
            const err = document.getElementById("err");
            msg.style.display = "none";
            err.style.display = "none";

            const res = await fetch(`${API}/auth/set-username?username=${username}`, {
                method: "POST",
                headers: {"Authorization": `Bearer ${token}`}
            });
            if (res.ok) {
                msg.style.display = "block";
                localStorage.setItem("username", username);
            } else {
                const data = await res.json();
                err.innerText = data.detail;
                err.style.display = "block";
            }
        }

        function goBack() {
            window.location.href = "/static/app.html";
        }
    </script>
</body>
</html>
